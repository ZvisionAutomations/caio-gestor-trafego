# Exemplo: anúncio ESTÁTICO (imagem única) Click-to-WhatsApp
# Copie para inbox/<sua-pasta>/manifest.yaml e ponha a imagem em assets/
campaign:
  name: "NW - Estatico - Ondas de calor - 001"
  product: "new_woman"
  objective: "OUTCOME_ENGAGEMENT"
  status_on_upload: "paused"
  page_id: "<PAGE_ID_DA_FANPAGE>"
  whatsapp_phone_number: "<NUMERO_WA_DA_LIVIA>"
  version: "v1"
adset:
  name: "Mulheres 45-60 BR"
  daily_budget_brl: 50
  age_min: 45
  age_max: 60
  gender: "female"
  locations: ["BR"]
  optimization_goal: "CONVERSATIONS"
ads:
  - name: "Estatico Hook 01"
    format: "image"
    asset: "assets/anuncio.jpg"
    primary_text: "Calores e noites mal dormidas no climatério? Fale com a gente."
    headline: "Equilíbrio no climatério"
    cta: "SEND_MESSAGE"   # go-live: confirmar WHATSAPP_MESSAGE (ver docs/research/ctwa-api-requirements.md)
